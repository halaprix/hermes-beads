[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-beads"
version = "1.1.0a1"
description = "Bridge Beads task state into Hermes Agent workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "halaprix" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
hb = "hermes_beads.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
