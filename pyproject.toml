[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-beads"
version = "1.0.1"
description = "Bridge Beads task state into Hermes Agent workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "halaprix" },
]
keywords = ["hermes-agent", "beads", "bd", "kanban", "task-management", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "click>=8.0",
]

[project.urls]
Homepage = "https://github.com/halaprix/hermes-beads"
Repository = "https://github.com/halaprix/hermes-beads"
Issues = "https://github.com/halaprix/hermes-beads/issues"
Changelog = "https://github.com/halaprix/hermes-beads/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.0",
]

[project.scripts]
hb = "hermes_beads.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
