name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 1. Repo hygiene — every PR must pass
  # ──────────────────────────────────────────────────────────────────────
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits in PR title
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

      - name: Run privacy scan
        run: |
          chmod +x scripts/privacy-scan.sh
          ./scripts/privacy-scan.sh

      - name: Validate Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-loopback --exclude-mail README.md CHANGELOG.md CONTRIBUTING.md AGENTS.md
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────────
  # 2. Python package — test + spellcheck
  # ──────────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: hygiene
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install '.[dev]'

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Spell check
        uses: streetsidesoftware/cspell-action@v8
        with:
          config: .cspell.json
          incremental_files_only: false
          ignore_paths: '["**/build/**", "**/.venv/**", "**/__pycache__/**", "**/.git/**", "LICENSE", ".github/ISSUE_TEMPLATE/**"]'

  # ──────────────────────────────────────────────────────────────────────
  # 3. Docs
  # ──────────────────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: hygiene
    steps:
      - uses: actions/checkout@v6

      - name: Check for broken relative links in Markdown
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: .github/markdown-link-check.json
          use-quiet-mode: 'yes'
          fail-on-error: false

  # ──────────────────────────────────────────────────────────────────────
  # 4. Aggregate status
  # ──────────────────────────────────────────────────────────────────────
  all-green:
    name: All checks
    runs-on: ubuntu-latest
    needs: [hygiene, test, docs]
    if: always()
    steps:
      - name: Status
        run: |
          if [ "${{ needs.hygiene.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.docs.result }}" != "success" ]; then
            echo "❌ One or more required checks failed."
            exit 1
          fi
          echo "✅ All required checks passed."
