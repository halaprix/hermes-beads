name: Publish Python package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Package index target'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Run release gates
        run: |
          bash scripts/scan-privacy.sh
          python -m pip install '.[dev]'
          hb --version
          python -m pytest -q
          python scripts/check_doc_coverage.py --threshold 0.9
          python scripts/generate_gitbook_docs.py --check
      - name: Build artifacts
        run: python -m build
      - name: Check artifacts
        run: python -m twine check dist/*
      - name: Clean wheel install smoke
        run: |
          python -m venv /tmp/hb-wheel-smoke
          /tmp/hb-wheel-smoke/bin/pip install dist/*.whl
          /tmp/hb-wheel-smoke/bin/hb --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-testpypi:
    if: github.event_name == 'push' || github.event.inputs.repository == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
      - name: TestPyPI install smoke
        run: |
          python -m venv /tmp/hb-testpypi-smoke
          VERSION=$(python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          /tmp/hb-testpypi-smoke/bin/pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "hermes-beads==$VERSION"
          /tmp/hb-testpypi-smoke/bin/hb --version

  publish-pypi:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.repository == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
